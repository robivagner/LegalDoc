name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-analyze:
    name: Build, SonarCloud Scan & Docker Push
    runs-on: ubuntu-latest
    permissions:
      packages: write # Permisiune pentru a scrie în GitHub Container Registry
      contents: read

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesar pentru analiza SonarQube

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: ⚙️ Setup Java (Necesar pentru SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner

      # --- 1. SCANARE SONARCLOUD ---
      - name: 🧹 SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"robivagner_LegalDoc" /o:"robivagner" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.python.version=3.11
          dotnet build LegalDoc.sln
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # --- 2. LOGIN LA GITHUB CONTAINER REGISTRY ---
      - name: 🐳 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. BUILD & PUSH DOCKER IMAGES ---
      - name: 🚀 Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/robivagner/legaldoc-api:latest

      - name: 🚀 Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ghcr.io/robivagner/legaldoc-web:latest

      - name: 🚀 Build and Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./Python
          push: true
          tags: ghcr.io/robivagner/legaldoc-ai:latest