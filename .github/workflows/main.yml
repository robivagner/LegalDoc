name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-analyze:
    name: Build, SonarCloud Scan & Docker Push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Setup Java (Necesar pentru SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Install Tools & Deps
        run: |
          dotnet tool install --global dotnet-sonarscanner
          python -m pip install --upgrade pip==24.0
          
          pip install \
            pytest==8.3.4 \
            pytest-cov==5.0.0 \
            httpx==0.27.0 \
            fastapi==0.115.0 \
            google-genai==0.6.0 \
            pytest-mock==3.14.0 \
            pytest-asyncio==0.23.8
          
          if [ -f Python/requirements.txt ]; then pip install -r Python/requirements.txt; fi

      # --- 1. SCANARE SONARCLOUD ---
      - name: 🧹 SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Pornim scannerul și definim rutele pentru rapoartele de coverage (C# și Python)
          dotnet-sonarscanner begin /k:"robivagner_LegalDoc" /o:"robivagner" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.python.version=3.11 \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Models/**,**/Dtos/**,**/*Query.cs,**/*Command.cs,Frontend/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="Python/coverage.xml"
          
          # Build .NET
          dotnet build LegalDoc.sln
          
          # Rulăm testele .NET (Unit + Integration) și generăm coverage
          dotnet test LegalDoc.sln --no-build --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.opencover.xml

          # Rulăm testele Python și generăm coverage.xml
          cd Python
          # SETĂM O CHEIE FALSĂ (dummy_key) ca să trecem de validarea din analyzer.py
          GEMINI_API_KEY=dummy_key_for_testing python -m pytest --cov=. --cov-report=xml:coverage.xml
          cd ..
          
          # Finalizăm analiza și trimitem datele la SonarCloud
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # --- 2. LOGIN LA GITHUB CONTAINER REGISTRY ---
      - name: 🐳 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. BUILD & PUSH DOCKER IMAGES ---
      - name: 🚀 Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/robivagner/legaldoc-api:latest

      - name: 🚀 Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ghcr.io/robivagner/legaldoc-web:latest

      - name: 🚀 Build and Push AI Service
        uses: docker/build-push-action@v6
        with:
          context: ./Python
          push: true
          tags: ghcr.io/robivagner/legaldoc-ai:latest